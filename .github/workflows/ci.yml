name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  DOTENV_FILE: packages/backend/test/src/assets/storage-file.env

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          # Full history so commitlint can walk the pull request range
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Restore the Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Lint
        run: npx nx run-many --target=lint --fix=false

      - name: Check that stylelint and prettier left the tree unchanged
        run: git diff --exit-code

      - name: Build
        run: npx nx run-many --target=build

      - name: Unit tests of every project except the end-to-end suite
        run: npx nx run-many --target=test --exclude=backend-test

      # The end-to-end suite reads the built assets (ASSETS_PATH in the env file)
      - name: Share the build with the test shards
        uses: actions/upload-artifact@v4
        with:
          name: dist-proxyherd
          path: dist/proxyherd
          retention-days: 1
          if-no-files-found: error

  backend-tests:
    name: End-to-end tests (shard ${{ matrix.shard }} of 3)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Use Python (runs the Python sample of the languages test)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Use Java (runs the Java sample of the languages test)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install --quiet requests

      - name: Get the build
        uses: actions/download-artifact@v4
        with:
          name: dist-proxyherd
          path: dist/proxyherd

      - name: Run the shard
        env:
          PYTHON: python
          JAVA: java
        run: npx jest --config packages/backend/test/jest.config.ts --ci --runInBand --shard=${{ matrix.shard }}/3

  # Single status check for branch protection: green only when everything above is.
  check:
    name: Lint, build and test
    needs:
      - build
      - backend-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          echo "lint and build: ${{ needs.build.result }}"
          echo "end-to-end tests: ${{ needs.backend-tests.result }}"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.backend-tests.result }}" = "success"

  secrets:
    name: Secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sed 's#  .*#  gitleaks.tar.gz#' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the commits of this pull request
        run: ./gitleaks detect --source . --redact --verbose --no-banner --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
