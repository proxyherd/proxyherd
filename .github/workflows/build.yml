name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build proxyherd and the fingerprint service
        run: npx nx run-many --target=build --projects=backend-app,fingerprint-app --skip-nx-cache --configuration production

      - name: Publish proxyherd to npm
        working-directory: dist/proxyherd
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @proxyherd/fingerprint to npm
        working-directory: dist/fingerprint
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (proxyherd)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/proxyherd/proxyherd
          tags: |
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}.{{minor}}.{{patch}}
            type=raw,value=latest

      - name: Build and push (proxyherd)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/backend/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker meta (fingerprint)
        id: meta_fingerprint
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/proxyherd/fingerprint
          tags: |
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}.{{minor}}.{{patch}}
            type=raw,value=latest

      - name: Build and push (fingerprint)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/fingerprint/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_fingerprint.outputs.tags }}
          labels: ${{ steps.meta_fingerprint.outputs.labels }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
