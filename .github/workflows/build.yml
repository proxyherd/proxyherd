name: Release

# Pushing a tag such as 1.0.0 publishes the CLI and the fingerprint service to
# npm, the container images to GHCR and a GitHub release. Running the workflow
# by hand is a dry run: everything is built and packed, nothing is published.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "package.json is at $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build proxyherd and the fingerprint service
        run: npx nx run-many --target=build --projects=backend-app,fingerprint-app --skip-nx-cache --configuration production

      - name: Smoke test the bundles
        run: |
          node dist/proxyherd/proxyherd.js --version
          node -e "require('./dist/fingerprint/package.json'); require('./dist/proxyherd/package.json')"
          echo "fingerprint dependencies:" && node -p "Object.keys(require('./dist/fingerprint/package.json').dependencies).join(' ')"

      - name: Upload the bundles
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/proxyherd
            dist/fingerprint
          retention-days: 7
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Trusted publishing (OIDC) needs npm 11.5.1 or later and Node 22.14 or later.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      # With an NPM_TOKEN secret the token is used; without one npm authenticates
      # through GitHub's OIDC token (a trusted publisher must be configured for the
      # package on npmjs.com). Provenance is attached in both cases.
      - name: Use the NPM_TOKEN secret
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc

      # A re-run of this job must not fail on a package that an earlier attempt
      # already published, so each publish is skipped when the version exists.
      - name: Publish proxyherd
        working-directory: dist/proxyherd
        run: |
          chmod +x proxyherd.js
          "$GITHUB_WORKSPACE/.github/scripts/npm-publish.sh" ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}

      - name: Publish @proxyherd/fingerprint
        working-directory: dist/fingerprint
        run: |
          chmod +x fingerprint.js
          "$GITHUB_WORKSPACE/.github/scripts/npm-publish.sh" ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}

  docker:
    name: Publish container images
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (proxyherd)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/proxyherd/proxyherd
          tags: |
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}.{{minor}}.{{patch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=dry-run,enable=${{ env.DRY_RUN == 'true' }}

      - name: Build and push (proxyherd)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/backend/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker meta (fingerprint)
        id: meta_fingerprint
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/proxyherd/fingerprint
          tags: |
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}.{{minor}}.{{patch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=dry-run,enable=${{ env.DRY_RUN == 'true' }}

      - name: Build and push (fingerprint)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/fingerprint/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ steps.meta_fingerprint.outputs.tags }}
          labels: ${{ steps.meta_fingerprint.outputs.labels }}

  release:
    name: GitHub release
    needs:
      - npm
      - docker
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Write the release notes from the changelog
        run: node .github/scripts/release-notes.js "$GITHUB_REF_NAME" > release-notes.md && cat release-notes.md

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
