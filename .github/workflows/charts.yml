name: Helm Charts

# Pushing a release tag publishes both charts to oci://ghcr.io/proxyherd/charts.
# Running the workflow by hand only lints and packages them.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          helm lint packages/charts/src/proxyherd --set fingerprintUrl=http://fingerprint.example/api/json
          helm lint packages/charts/src/proxyherd-simple-cluster --set fingerprintUrl=http://fingerprint.example/api/json

      - name: Package charts
        run: |
          rm -Rf dist/charts
          mkdir -p dist/charts
          helm package packages/charts/src/proxyherd -d dist/charts
          helm package packages/charts/src/proxyherd-simple-cluster -d dist/charts
          ls -l dist/charts

      - name: Login to GitHub Container Registry
        if: github.ref_type == 'tag'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push charts as OCI artifacts
        if: github.ref_type == 'tag'
        run: |
          for chart in dist/charts/*.tgz; do
            helm push "$chart" oci://ghcr.io/proxyherd/charts
          done
