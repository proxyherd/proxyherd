# Address of your fingerprint service (required): https://proxyherd.github.io/proxyherd/deployment/fingerprint
fingerprintUrl: ""

# Secrets used to sign the backend and frontend JWT tokens (required): two long random strings
backendJwtSecret: ""
frontendJwtSecret: ""

# Authentication providers for the user interface (configure at least one)
auth: {}
#    local:
#        username: admin
#        password: change-me
#    google:
#        clientId: ""
#        clientSecret: ""
#    github:
#        clientId: ""
#        clientSecret: ""

image:
    repository: ghcr.io/proxyherd/proxyherd
    tag: latest
    pullPolicy: Always
    pullSecrets: []

resources:
    limits:
        cpu: 1000m
        memory: 2Gi
    requests:
        cpu: 100m
        memory: 256Mi

fileStorageSize: 100Mi

commander:
    port: 8890

master:
    port: 8888

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
