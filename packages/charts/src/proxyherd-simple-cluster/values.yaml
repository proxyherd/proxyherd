# Address of your own fingerprint service. Empty: the shared service at fingerprint.proxyherd.com
# (best effort, rate limited per IP address). See https://proxyherd.github.io/proxyherd/deployment/fingerprint
fingerprintUrl: ""

# Secrets used to sign the backend and frontend JWT tokens (required): two long random strings
backendJwtSecret: ""
frontendJwtSecret: ""

# Authentication providers for the user interface (configure at least one)
auth: {}
#    local:
#        username: admin
#        password: change-me
#    google:
#        clientId: ""
#        clientSecret: ""
#    github:
#        clientId: ""
#        clientSecret: ""

image:
    repository: ghcr.io/proxyherd/proxyherd
    tag: latest
    pullPolicy: Always
    pullSecrets: []

commander:
    port: 8890
    fileStorageSize: 100Mi
    resources:
        limits:
            cpu: 1000m
            memory: 2Gi
        requests:
            cpu: 100m
            memory: 256Mi

master:
    port: 8888
    resources:
        limits:
            cpu: 1000m
            memory: 2Gi
        requests:
            cpu: 100m
            memory: 256Mi

refresh:
    resources:
        limits:
            cpu: 1000m
            memory: 2Gi
        requests:
            cpu: 100m
            memory: 256Mi

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
