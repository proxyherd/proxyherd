name = "proxyherd-fingerprint"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Your own deployment (`npx wrangler deploy`) has no rate limit. To add one, copy the
# [[env.hosted.ratelimits]] block below without the `env.hosted.` prefix.

# The shared service at fingerprint.proxyherd.com, deployed by the maintainers with
# `npx wrangler deploy --env hosted` from the Cloudflare account that holds the proxyherd.com zone.
[env.hosted]
name = "proxyherd-fingerprint-hosted"
workers_dev = false
routes = [
    { pattern = "fingerprint.proxyherd.com", custom_domain = true },
]

[env.hosted.vars]
HOSTED = "true"

[env.hosted.observability]
enabled = false

# 20 requests per minute per IP address (per /64 network for IPv6) and Cloudflare location.
# ProxyHerd checks each proxy once a minute by default (up to 3 requests when a failed check is
# retried; a rate limited check is not), so this leaves room for a few proxies behind one address
# and stops anyone hammering the service from one address.
# Needs wrangler 4.36.0 or later. After a deploy, `GET /health` must answer "rateLimit": true;
# if it does not, the binding was not deployed and the service has no limit.
[[env.hosted.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [env.hosted.ratelimits.simple]
  limit = 20
  period = 60
